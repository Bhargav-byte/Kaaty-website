name: Feature Request
description: Propose a new feature or enhancement for the Kaaty website
labels: ["enhancement", "needs-triage"]
assignees:
  - Bhargav-byte

body:
  - type: markdown
    attributes:
      value: |
        Have a great idea? Describe it below and we'll evaluate it for the roadmap.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What user need does it address?
      placeholder: "Currently there is no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider, and why is your proposal better?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low — Nice to have
        - Medium — Would significantly improve UX
        - High — Blocks a key use-case
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or references to similar implementations.
