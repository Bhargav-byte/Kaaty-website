<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kaaty — One Platform. Every Food Business.</title>
<meta name="description" content="Kaaty is the all-in-one food-tech platform — POS billing, KDS, QR ordering, kiosks, inventory, and customer experience for restaurants, cafés, food courts, and college canteens." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
        colors: {
          kaaty: {
            50:  '#FFF3EB',
            100: '#FFE3CC',
            200: '#FFC499',
            300: '#FFA266',
            400: '#FF8533',
            500: '#FF6B00',
            600: '#E65F00',
            700: '#C24F00',
            800: '#993E00',
            900: '#7A3200',
          },
          navy: {
            DEFAULT: '#111827',
            50:  '#F8FAFC',
            100: '#F1F5F9',
            200: '#E2E8F0',
            300: '#CBD5E1',
            400: '#94A3B8',
            500: '#64748B',
            600: '#475569',
            700: '#334155',
            800: '#1E293B',
            900: '#0F172A',
            950: '#0B1120',
          },
        },
        boxShadow: {
          soft: '0 1px 2px rgba(16,24,40,.04), 0 12px 32px -12px rgba(16,24,40,.18)',
          lift: '0 24px 60px -20px rgba(16,24,40,.28)',
          glow: '0 0 0 1px rgba(255,107,0,.35), 0 0 40px -4px rgba(255,107,0,.45)',
        },
        keyframes: {
          floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
          floaty2: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(8px)' } },
          pulseDot: { '0%,100%': { opacity: 1 }, '50%': { opacity: .35 } },
          shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
        },
        animation: {
          floaty: 'floaty 6s ease-in-out infinite',
          floaty2: 'floaty2 7s ease-in-out infinite',
          pulseDot: 'pulseDot 1.8s ease-in-out infinite',
        },
      },
    },
  };
</script>

<style>
  html { scroll-behavior: smooth; }
  body { background: #ffffff; color: #111827; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  ::selection { background: #FF6B00; color: #fff; }
  .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }

  /* subtle premium grid background */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(17,24,39,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,24,39,.045) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .grid-bg-fade {
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
  }
  .dotgrid {
    background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; border: 3px solid #fff; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
  .reveal.in { opacity: 1; transform: none; }

  .menu-enter { animation: menuIn .18s cubic-bezier(.16,1,.3,1); }
  @keyframes menuIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .gradient-text { background: linear-gradient(95deg,#FF6B00 0%, #FF8533 60%, #FFB066 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* marquee logo wall */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display: flex; width: max-content; animation: marquee 38s linear infinite; }
  .marquee-mask { -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); }
  .marquee-wrap:hover .marquee-track { animation-play-state: paused; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="js/shared.jsx"></script>
  <script type="text/babel" src="js/data.jsx"></script>
  <script type="text/babel" src="js/navbar.jsx"></script>
  <script type="text/babel" src="js/hero.jsx"></script>
  <script type="text/babel" src="js/sections-a.jsx"></script>
  <script type="text/babel" src="js/sections-b.jsx"></script>
  <script type="text/babel" src="js/blocks.jsx"></script>
  <script type="text/babel" src="js/subpages.jsx"></script>
  <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
